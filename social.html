<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena Social | SpotiStats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #fff; overflow-x: hidden; }
        .bg-card { background-color: #1a1a1a; }
        .spotify-green { color: #1DB954; }
        .bg-spotify-green { background-color: #1DB954; }
        
        .win-dot { width: 10px; height: 10px; border-radius: 50%; }
        .win-user { background: #1DB954; box-shadow: 0 0 10px #1DB954; }
        .win-friend { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        
        .avatar-fallback { background: linear-gradient(135deg, #333, #222); display: flex; items-center: center; justify-content: center; font-weight: 900; color: #fff; border: 2px solid rgba(255,255,255,0.1); }
        .streak-fire { filter: drop-shadow(0 0 12px #ff4d00); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-10 flex flex-col items-center">
    
    <!-- HEADER -->
    <header class="w-full max-w-6xl flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-spotify-green rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(29,185,84,0.3)]">
                <svg class="w-7 h-7 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </div>
            <nav class="flex items-center gap-6 bg-[#1a1a1a] px-6 py-3 rounded-full border border-white/5">
                <a href="dashboard.html" class="text-[10px] font-black uppercase tracking-widest text-neutral-400 hover:text-white">Música</a>
                <a href="social.html" class="text-[10px] font-black uppercase tracking-widest text-[#1DB954]">Social</a>
                <a href="profile.html" class="text-[10px] font-black uppercase tracking-widest text-neutral-400 hover:text-white">Historial</a>
            </nav>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex gap-1 bg-[#1a1a1a] p-1 rounded-full border border-white/5">
                <button id="filter-today" class="px-5 py-2 text-[9px] font-black uppercase rounded-full bg-spotify-green text-black">Hoy</button>
                <button id="filter-week" class="px-5 py-2 text-[9px] font-black uppercase rounded-full text-neutral-500 hover:text-white">Semana</button>
                <button id="filter-month" class="px-5 py-2 text-[9px] font-black uppercase rounded-full text-neutral-500 hover:text-white">Mes</button>
            </div>
            <button id="add-friend-btn" class="px-6 py-3 bg-spotify-green text-black font-black text-xs rounded-full hover:scale-105 transition-all shadow-lg">Buscar Amigos</button>
        </div>
    </header>

    <main class="w-full max-w-6xl">
        <h2 class="text-3xl font-black italic mb-8 tracking-tighter">Arena</h2>
        
        <div class="grid grid-cols-1 lg:grid-cols-[1.6fr_1fr] gap-8 items-start">
            
            <!-- COLUMNA IZQUIERDA: TARJETA DE BATALLA -->
            <div id="arena-main-container" class="w-full flex justify-center">
                <!-- Se inyectará por JS -->
                <div class="bg-card w-full rounded-[3rem] p-12 text-center border border-white/5 animate-pulse">
                    <p class="text-neutral-500 italic">Cargando duelo...</p>
                </div>
            </div>

            <!-- COLUMNA DERECHA: INFO SECUNDARIA -->
            <div class="flex flex-col gap-6">
                <!-- MODO RACHA -->
                <div id="streak-card" class="bg-card p-10 rounded-[3rem] border border-orange-500/10 flex flex-col items-center text-center group">
                    <div class="text-6xl mb-6 streak-fire">🔥</div>
                    <h3 class="text-[10px] font-black uppercase text-orange-500 mb-2 tracking-widest">Modo Racha</h3>
                    <p class="text-3xl font-black italic mb-2"><span id="streak-days">0</span> DÍAS</p>
                    <p class="text-[11px] text-neutral-500 font-medium max-w-[200px]">Vas dominando la arena. ¡No dejes que se apague!</p>
                </div>

                <!-- MATCH MUSICAL -->
                <div id="match-card" class="bg-card p-10 rounded-[3rem] border border-[#1DB954]/10 flex flex-col items-center text-center hidden">
                    <div class="text-5xl mb-6">🎵</div>
                    <h3 class="text-[10px] font-black uppercase text-[#1DB954] mb-2 tracking-widest">Match Musical</h3>
                    <p class="text-2xl font-black italic"><span id="match-count">0</span> COMUNES</p>
                    <p class="text-[11px] text-neutral-500 mt-2">Canciones en común hoy</p>
                </div>

                <!-- ESPACIO PARA FUTURAS CARDS -->
                <div class="bg-card p-10 rounded-[3rem] border border-white/5 border-dashed opacity-30 flex items-center justify-center">
                    <p class="text-[9px] font-black uppercase tracking-widest text-neutral-500">Más estadísticas próximamente</p>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL DE AMIGOS (IGUAL QUE ANTES PERO CON ESTILO #1a1a1a) -->
    <div id="friend-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-[#1a1a1a] p-10 rounded-[3.5rem] border border-white/5 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black italic">Amigos</h2>
                <button id="close-friend-modal" class="bg-white/5 p-3 rounded-full hover:bg-white/10 transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="flex gap-4 mb-8 border-b border-white/5 pb-2">
                <button id="tab-search" class="text-[10px] font-black uppercase tracking-widest text-spotify-green border-b-2 border-spotify-green pb-2">Buscar</button>
                <button id="tab-requests" class="text-[10px] font-black uppercase tracking-widest text-neutral-500 pb-2">Solicitudes</button>
                <button id="tab-manage" class="text-[10px] font-black uppercase tracking-widest text-neutral-500 pb-2">Duelos</button>
            </div>
            <div id="section-search" class="space-y-4">
                <input type="text" id="friend-search-input" placeholder="Nombre de usuario..." class="w-full bg-black/50 border border-white/10 rounded-2xl py-4 px-6 text-sm focus:border-spotify-green outline-none transition-all">
                <div id="friend-results" class="space-y-3 max-h-60 overflow-y-auto custom-scrollbar pr-2"></div>
            </div>
            <div id="section-requests" class="hidden"><div id="friend-requests" class="space-y-3"></div></div>
            <div id="section-manage" class="hidden"><div id="active-duels-list" class="space-y-3"></div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabaseClient } from './js/supabase.js';
        import { initSocial, loadSocialPage } from './js/social.js';
        async function bootstrap() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) { initSocial(session.user); loadSocialPage(session.user.id); }
            else { window.location.href = 'index.html'; }
        }
        bootstrap();
    </script>
</body>
</html>
