<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social | SpotiStats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { height: 4px; width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        .streak-fire { filter: drop-shadow(0 0 8px #ff4d00); animation: flicker 2s infinite ease-in-out; }
        @keyframes flicker { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.1); } }
        .win-dot { width: 12px; height: 12px; border-radius: 50%; }
        .win-user { background: #1DB954; box-shadow: 0 0 10px #1DB954; }
        .win-friend { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex flex-col items-center">
    
    <header class="w-full max-w-6xl flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#1DB954] rounded-full flex items-center justify-center">
                <svg class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            </div>
            <h1 class="text-2xl font-black tracking-tighter">Social</h1>
        </div>
        <nav class="flex items-center gap-6 bg-white/5 px-6 py-3 rounded-full border border-white/10">
            <a href="dashboard.html" class="text-[10px] font-black uppercase tracking-widest text-neutral-400 hover:text-white transition-colors">Música</a>
            <a href="social.html" class="text-[10px] font-black uppercase tracking-widest text-[#1DB954]">Social</a>
            <a href="profile.html" class="text-[10px] font-black uppercase tracking-widest text-neutral-400 hover:text-white transition-colors">Historial</a>
        </nav>
        <button id="add-friend-btn" class="px-6 py-3 bg-[#1DB954] text-black font-black text-xs rounded-full hover:scale-105 transition-transform shadow-lg">Buscar Amigos</button>
    </header>

    <main class="w-full max-w-6xl space-y-10">
        <!-- SECCIÓN ARENA DUO -->
        <section>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-black italic">Arena</h2>
                <div class="flex gap-2 bg-white/5 p-1 rounded-full border border-white/10">
                    <button id="filter-today" class="px-4 py-1.5 text-[9px] font-black uppercase rounded-full bg-[#1DB954] text-black">Hoy</button>
                    <button id="filter-week" class="px-4 py-1.5 text-[9px] font-black uppercase rounded-full text-neutral-400 hover:text-white">Semana</button>
                    <button id="filter-month" class="px-4 py-1.5 text-[9px] font-black uppercase rounded-full text-neutral-400 hover:text-white">Mes</button>
                </div>
            </div>
            
            <div id="arena-container" class="flex gap-6 overflow-x-auto pb-6 custom-scrollbar snap-x">
                <!-- Los duelos se cargarán aquí dinámicamente -->
                <div class="glass p-10 rounded-[3rem] w-full text-center py-20 text-neutral-500 italic">No tienes duelos activos. ¡Busca a un amigo!</div>
            </div>
        </section>

        <!-- SECCIÓN DE RACHA Y MATCH (DINÁMICA) -->
        <section id="extra-stats-section" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
            <!-- Racha Card -->
            <div id="streak-card" class="glass p-8 rounded-[2.5rem] flex items-center justify-between border-orange-500/10 hidden">
                <div>
                    <h3 class="text-[10px] font-black uppercase text-orange-500 mb-1 tracking-widest">Modo Racha</h3>
                    <p id="streak-text" class="text-2xl font-black">Llevas <span id="streak-days">0</span> días dominando</p>
                </div>
                <div class="text-5xl streak-fire">🔥</div>
            </div>

            <!-- Match Card (Solo si hay comunes) -->
            <div id="match-card" class="glass p-8 rounded-[2.5rem] flex items-center justify-between border-[#1DB954]/10 hidden">
                <div>
                    <h3 class="text-[10px] font-black uppercase text-[#1DB954] mb-1 tracking-widest">Match Musical</h3>
                    <p id="match-text" class="text-2xl font-black"><span id="match-count">0</span> canciones en común</p>
                </div>
                <div class="text-4xl">🎵</div>
            </div>
        </section>

        <!-- BUSCADOR DE AMIGOS (MODAL) -->
        <div id="friend-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-[200] hidden flex items-center justify-center p-4">
            <div class="bg-[#121212] p-8 rounded-[3rem] border border-white/5 w-full max-w-md shadow-2xl">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-black italic">Amigos</h2>
                    <button id="close-friend-modal" class="bg-white/5 p-2 rounded-full hover:bg-white/10"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg></button>
                </div>
                
                <div class="space-y-6">
                    <div class="relative">
                        <input type="text" id="friend-search-input" placeholder="Nombre de usuario..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-sm focus:outline-none focus:border-[#1DB954] transition-all">
                        <button id="search-btn" class="absolute right-3 top-3 bg-[#1DB954] text-black p-2 rounded-xl"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg></button>
                    </div>

                    <div id="friend-results" class="space-y-3 max-h-60 overflow-y-auto custom-scrollbar pr-2"></div>
                    
                    <div class="pt-6 border-t border-white/5">
                        <h4 class="text-[10px] font-black uppercase text-neutral-500 mb-4 tracking-widest">Solicitudes Pendientes</h4>
                        <div id="friend-requests" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabaseClient } from './js/supabase.js';
        import { initSocial, loadSocialPage } from './js/social.js';

        async function bootstrap() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                initSocial(session.user);
                loadSocialPage(session.user.id);
            } else {
                window.location.href = 'index.html';
            }
        }
        bootstrap();
    </script>
</body>
</html>
