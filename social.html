<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas | Playcount</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .text-gradient { background: linear-gradient(to right, #1DB954, #1ed760); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        #album-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(100px) saturate(1.8); opacity: 0; transition: opacity 3s ease; background-size: cover; background-position: center; }
        #album-bg.visible { opacity: 0.25; }

        .profile-dropdown {
            position: fixed;
            top: 68px;
            right: 16px;
            transform-origin: top right;
            transition: all 0.2s ease-out;
            transform: scale(0.95);
            opacity: 0;
            pointer-events: none;
            z-index: 200;
        }
        .profile-dropdown.active { transform: scale(1); opacity: 1; pointer-events: auto; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .win-line { height: 3px; border-radius: 2px; flex: 1; transition: all 0.3s ease; }
        .win-user { background: #1DB954; box-shadow: 0 0 15px rgba(29, 185, 84, 0.5); }
        .win-friend { background: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        .win-none { background: rgba(255,255,255,0.05); }

        .avatar-fallback { background: linear-gradient(135deg, #111, #222); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .streak-fire { filter: drop-shadow(0 0 15px #ff4d00); animation: flicker 3s infinite ease-in-out; }
        @keyframes flicker { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } }

        /* ── Toast notifications ── */
        #toast-container { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column-reverse; gap: 8px; z-index: 9999; pointer-events: none; align-items: center; }
        .toast { background: rgba(15,15,15,0.95); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); border-radius: 100px; padding: 12px 20px; font-size: 0.75rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; animation: toastIn 0.35s cubic-bezier(0.16,1,0.3,1) both; pointer-events: auto; white-space: nowrap; font-family: 'Inter', sans-serif; letter-spacing: 0.01em; }
        .toast.success { border-color: rgba(29,185,84,0.35); box-shadow: 0 0 20px rgba(29,185,84,0.1); }
        .toast.error   { border-color: rgba(239,68,68,0.35);  box-shadow: 0 0 20px rgba(239,68,68,0.1); }
        .toast.out { animation: toastOut 0.3s ease-in both; }
        @keyframes toastIn  { from { opacity: 0; transform: translateY(14px) scale(0.88); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { from { opacity: 1; transform: translateY(0) scale(1); }         to { opacity: 0; transform: translateY(8px)  scale(0.92); } }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col items-center">
    
    <div id="album-bg"></div>

    <header class="w-full max-w-6xl flex flex-col md:flex-row justify-between items-center mb-8 gap-4 relative z-[100]">
        <div class="flex items-center gap-3 w-full md:w-auto justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#1DB954] rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(29,185,84,0.4)]">
                    <svg class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15.001 10.62 18.661 12.9c.42.18.6.78.3 1.14zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.62.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                </div>
                <h1 class="text-xl font-black tracking-tighter">Playcount</h1>
            </div>
            <button id="profile-btn-mobile" class="md:hidden w-10 h-10 rounded-full border border-white/20 overflow-hidden">
                <img id="user-avatar-mobile" src="" class="w-full h-full object-cover bg-neutral-800">
            </button>
        </div>

        <nav class="flex items-center gap-4 bg-white/5 px-5 py-2.5 rounded-full border border-white/10 w-full md:w-auto justify-center">
            <a href="dashboard.html" class="text-[10px] font-black uppercase tracking-widest text-neutral-400 hover:text-white transition-colors">Música</a>
            <a href="social.html" class="text-[10px] font-black uppercase tracking-widest text-[#1DB954]">Social</a>
            <a href="profile.html" class="text-[10px] font-black uppercase tracking-widest text-neutral-400 hover:text-white transition-colors">Estadísticas</a>
        </nav>

        <div class="relative hidden md:block">
            <button id="profile-btn" class="flex items-center gap-3 bg-white/5 p-1 pr-4 rounded-full border border-white/10">
                <img id="user-avatar" src="" class="w-8 h-8 rounded-full bg-neutral-800 object-cover">
                <span id="user-name" class="text-xs font-bold truncate max-w-[80px]">...</span>
            </button>
        </div>
        <!-- Dropdown fixed: funciona en mobile y desktop -->
        <div id="profile-dropdown" class="profile-dropdown w-48 bg-[#121212] border border-white/10 rounded-2xl shadow-2xl p-1">
            <button id="open-friends-btn" class="w-full text-left px-4 py-2.5 hover:bg-white/5 text-white font-bold text-xs rounded-xl mb-1">Gestionar Amigos</button>
            <button id="logout-btn" class="w-full text-left px-4 py-2.5 hover:bg-red-500/10 text-red-500 font-bold text-xs rounded-xl">Cerrar Sesión</button>
        </div>
    </header>

    <main class="w-full max-w-5xl flex flex-col items-center gap-10 relative z-10">
        <!-- FILTROS CENTRADOS -->
        <div class="flex flex-col items-center gap-6">
            <div class="flex gap-1 bg-white/5 p-1 rounded-full border border-white/10">
                <button id="filter-today" class="px-4 sm:px-6 py-2 text-[9px] font-black uppercase rounded-full bg-[#1DB954] text-black">Hoy</button>
                <button id="filter-week" class="px-4 sm:px-6 py-2 text-[9px] font-black uppercase rounded-full text-neutral-500 hover:text-white">Semanal</button>
                <button id="filter-month" class="px-4 sm:px-6 py-2 text-[9px] font-black uppercase rounded-full text-neutral-500 hover:text-white">Mensual</button>
            </div>
        </div>
        
        <!-- CONTENEDOR PRINCIPAL CENTRADO -->
        <div id="arena-main-container" class="w-full max-w-2xl">
            <!-- La card de comparativa se inyectará aquí -->
        </div>

        <!-- INFO SECUNDARIA EN GRID CENTRADO -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
            <!-- Racha Card -->
            <div id="streak-card" class="glass p-8 rounded-[2.5rem] flex flex-col items-center text-center hidden">
                <div class="text-5xl mb-4 streak-fire">🔥</div>
                <h3 class="text-[9px] font-black uppercase text-orange-500 mb-1 tracking-widest">Racha Actual</h3>
                <p class="text-3xl font-black italic tracking-tighter"><span id="streak-days">0</span> DÍAS</p>
            </div>

            <!-- Match Card -->
            <div id="match-card" class="glass p-8 rounded-[2.5rem] flex flex-col items-center text-center hidden">
                <div class="text-4xl mb-4">🎵</div>
                <h3 class="text-[9px] font-black uppercase text-[#1DB954] mb-1 tracking-widest">En Sintonía</h3>
                <p class="text-2xl font-black italic tracking-tighter"><span id="match-count">0</span> COMUNES</p>
            </div>
        </div>
    </main>

    <!-- Botón flotante de amigos (solo mobile) -->
    <button id="fab-friends-btn" class="md:hidden fixed bottom-6 right-6 w-14 h-14 bg-[#1DB954] text-black rounded-full flex items-center justify-center shadow-[0_0_25px_rgba(29,185,84,0.5)] z-[150] hover:scale-105 transition-transform">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
    </button>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- MODAL DE AMIGOS -->
    <div id="friend-modal" class="fixed inset-0 bg-black/90 backdrop-blur-2xl z-[300] hidden flex items-center justify-center p-4">
        <div class="bg-[#0c0c0c] p-10 rounded-[3.5rem] border border-white/5 w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black italic text-gradient">Amigos</h2>
                <button id="close-friend-modal" class="bg-white/5 p-3 rounded-full hover:bg-white/10"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="flex gap-4 mb-8 border-b border-white/5 pb-2 flex-wrap">
                <button id="tab-search" class="text-[10px] font-black uppercase tracking-widest text-[#1DB954] border-b-2 border-[#1DB954] pb-2">Buscar</button>
                <button id="tab-requests" class="text-[10px] font-black uppercase tracking-widest text-neutral-500 pb-2">Solicitudes</button>
                <button id="tab-manage" class="text-[10px] font-black uppercase tracking-widest text-neutral-500 pb-2">Gestionar</button>
                <button id="tab-foryou" class="relative text-[10px] font-black uppercase tracking-widest text-neutral-500 pb-2">
                    Para ti
                    <span id="foryou-badge" class="hidden absolute -top-2 -right-4 min-w-[18px] h-[18px] bg-[#1DB954] text-black text-[8px] font-black rounded-full flex items-center justify-center px-1 shadow-[0_0_8px_rgba(29,185,84,0.6)] animate-pulse"></span>
                </button>
            </div>
            <div id="section-search" class="space-y-4">
                <div class="flex gap-2">
                    <input type="text" id="friend-search-input" placeholder="Nombre de usuario..." class="flex-1 bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-sm focus:border-[#1DB954] outline-none">
                    <button id="copy-invite-btn" class="bg-[#1DB954] text-black px-4 rounded-2xl font-black text-[10px] uppercase hover:bg-[#1ed760] transition-colors shadow-[0_0_15px_rgba(29,185,84,0.3)]">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                    </button>
                </div>
                <div id="friend-results" class="space-y-3 max-h-60 overflow-y-auto custom-scrollbar pr-2"></div>
            </div>
            <div id="section-requests" class="hidden"><div id="friend-requests" class="space-y-3"></div></div>
            <div id="section-manage" class="hidden"><div id="active-duels-list" class="space-y-3"></div></div>
            <div id="section-foryou" class="hidden"><div id="foryou-list" class="space-y-3 max-h-72 overflow-y-auto custom-scrollbar pr-1"></div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabaseClient, getSessionResilient } from './js/supabase.js';
        import { initSocial, loadSocialPage } from './js/social.js';
        import { getValidToken } from './js/token_manager.js';
        import { updateForYouBadge } from './js/social.js';

        async function bootstrap() {
            const session = await getSessionResilient();
            if (session) {
                const user = session.user;
                document.getElementById('user-name').textContent = user.user_metadata.display_name || user.email.split('@')[0];
                const avatar = user.user_metadata.avatar_url || '';
                document.getElementById('user-avatar').src = avatar;
                if (document.getElementById('user-avatar-mobile')) document.getElementById('user-avatar-mobile').src = avatar;
                
                const menu = document.getElementById('profile-dropdown');
                const toggleMenu = (e) => { e.stopPropagation(); menu.classList.toggle('active'); };
                document.getElementById('profile-btn')?.addEventListener('click', toggleMenu);
                document.getElementById('profile-btn-mobile')?.addEventListener('click', toggleMenu);
                document.addEventListener('click', (e) => {
                    const btnD = document.getElementById('profile-btn');
                    const btnM = document.getElementById('profile-btn-mobile');
                    if (!menu.contains(e.target) && e.target !== btnD && e.target !== btnM) {
                        menu.classList.remove('active');
                    }
                });

                // Botón FAB de amigos en móvil
                document.getElementById('fab-friends-btn')?.addEventListener('click', () => {
                    document.getElementById('friend-modal').classList.remove('hidden');
                    switchTab('search', user.id);
                });

                document.getElementById('logout-btn').onclick = async () => {
                    await supabaseClient.auth.signOut();
                    window.location.href = 'index.html';
                };

                initSocial(user);
                loadSocialPage(user.id);
                updateForYouBadge(user.id);
                
                // Fondo dinámico
                setInterval(() => updateBackground(user.id), 10000);
                updateBackground(user.id);
            } else {
                window.location.href = 'index.html';
            }
        }

        async function updateBackground(userId) {
            const token = await getValidToken(userId);
            if (!token) return;
            try {
                const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.status === 200) {
                    const data = await res.json();
                    if (data && data.item) {
                        const imgUrl = data.item.album.images[0].url;
                        const bg = document.getElementById('album-bg');
                        bg.style.backgroundImage = `url(${imgUrl})`;
                        bg.classList.add('visible');
                    }
                }
                // Si no hay nada sonando (204/pausado), dejamos el fondo como está —
                // no lo reemplazamos con /recently-played porque esa canción puede
                // no ser la misma que se acaba de pausar (Spotify tarda en
                // registrarla ahí), y pondría una portada que no corresponde.
            } catch (e) {}
        }

        bootstrap();
    </script>
</body>
</html>
