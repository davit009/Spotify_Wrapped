<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social | SpotiStats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
    
    <!-- NAVBAR (Igual a Dashboard para consistencia) -->
    <header class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center mb-10 gap-6">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#1DB954] rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(29,185,84,0.4)]">
                <svg class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.5 14.75c-.15.25-.45.35-.7.2-2.35-1.45-5.3-1.75-8.8-.95-.3.05-.6-.15-.65-.45s.15-.6.45-.65c3.85-.85 7.1-.5 9.7 1.1.25.15.35.45.2.75zm1.25-2.75c-.2.3-.6.4-.9.2-2.7-1.65-6.8-2.15-9.95-1.15-.35.1-.7-.1-.8-.45s.1-.7.45-.8c3.65-1.1 8.15-.55 11.25 1.35.3.15.4.55.2.85zm.1-2.8c-3.25-1.95-8.65-2.15-11.75-1.2-.5.15-1-.15-1.15-.65-.15-.5.15-1 .65-1.15 3.55-1.1 9.5-.85 13.25 1.4.45.25.6.85.35 1.3-.25.45-.85.6-1.35.3z"/></svg>
            </div>
            <h1 class="text-2xl font-black tracking-tighter">SpotiStats</h1>
        </div>
        <nav class="flex items-center gap-6 bg-white/5 px-6 py-3 rounded-full border border-white/10">
            <a href="dashboard.html" class="text-xs font-black uppercase tracking-widest text-neutral-400 hover:text-white transition-colors">Música</a>
            <a href="social.html" class="text-xs font-black uppercase tracking-widest text-[#1DB954]">Social</a>
            <a href="profile.html" class="text-xs font-black uppercase tracking-widest text-neutral-400 hover:text-white transition-colors">Historial</a>
        </nav>
        <div class="flex items-center gap-4">
            <button id="invite-btn" class="bg-[#1DB954] text-black text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-full hover:scale-105 transition-transform">Invitar Amigo</button>
            <div class="flex items-center gap-3 bg-white/5 p-1 pr-4 rounded-full border border-white/10">
                <img id="user-avatar" src="" class="w-8 h-8 rounded-full border border-white/10 hidden" alt="Avatar">
                <span id="user-name" class="text-sm font-bold">...</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-[1fr_1.5fr] gap-8">
        
        <!-- Columna Izquierda: Gestión y Marcadores -->
        <div class="flex flex-col gap-6">
            
            <!-- Marcadores Rápidos -->
            <div class="grid grid-cols-1 gap-4">
                <div class="glass p-6 rounded-[2rem] relative overflow-hidden">
                    <h3 class="text-[10px] font-black uppercase text-neutral-500 mb-4 tracking-widest">Líder del Día</h3>
                    <div id="social-today-content" class="flex items-center gap-4">
                        <p class="text-xs text-neutral-600 italic">Cargando competencia...</p>
                    </div>
                </div>
                <div class="glass p-6 rounded-[2rem] relative overflow-hidden">
                    <h3 class="text-[10px] font-black uppercase text-neutral-500 mb-4 tracking-widest">Líder de la Semana</h3>
                    <div id="social-week-content" class="flex items-center gap-4">
                        <p class="text-xs text-neutral-600 italic">Analizando duelos...</p>
                    </div>
                </div>
            </div>

            <!-- Buscador de Amigos Mejorado -->
            <div class="glass p-8 rounded-[2.5rem]">
                <h3 class="text-xl font-black mb-6 italic">Buscar Amigos</h3>
                <div class="relative mb-6">
                    <input type="text" id="user-search-input" placeholder="Nombre de tu amigo..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-12 text-sm focus:outline-none focus:border-[#1DB954] transition-colors">
                    <svg class="w-5 h-5 text-neutral-600 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div id="user-search-results" class="space-y-3 max-h-[300px] overflow-y-auto custom-scrollbar pr-2">
                    <!-- Resultados -->
                </div>
            </div>

            <!-- Mis Retos Activos -->
            <div class="glass p-8 rounded-[2.5rem]">
                <h3 class="text-xl font-black mb-6 italic">Retos Activos</h3>
                <div id="social-tab-active" class="space-y-4 max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
                    <!-- Retos -->
                </div>
            </div>
        </div>

        <!-- Columna Derecha: Historial en Común -->
        <div class="flex flex-col gap-6">
            <div class="glass p-8 rounded-[2.5rem] flex-1 flex flex-col min-h-[600px]">
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h2 class="text-3xl font-black italic">Historial en Común</h2>
                        <p class="text-[10px] text-neutral-500 uppercase font-black tracking-widest mt-1">Canciones que ambos escucharon hoy</p>
                    </div>
                    <div class="bg-[#1DB954]/10 text-[#1DB954] p-3 rounded-2xl">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    </div>
                </div>

                <div id="common-tracks-list" class="flex-1 space-y-4 overflow-y-auto custom-scrollbar pr-2">
                    <div class="flex flex-col items-center justify-center h-full text-neutral-600 italic">
                        <p>No hay coincidencias hoy todavía.</p>
                        <p class="text-[10px] uppercase font-bold mt-2 tracking-tighter">¡Sigan escuchando para hacer match!</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabaseClient } from './js/supabase.js';
        import { initSocial, loadSocialPage } from './js/social.js';

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                const userMeta = session.user.user_metadata;
                document.getElementById('user-name').textContent = userMeta.full_name || 'Usuario';
                if (userMeta.avatar_url) {
                    const avatarImg = document.getElementById('user-avatar');
                    avatarImg.src = userMeta.avatar_url;
                    avatarImg.classList.remove('hidden');
                }
                
                // Iniciar lógica social
                initSocial(session.user);
                loadSocialPage(session.user.id);
            } else {
                window.location.href = 'index.html';
            }
        });

        // Botón Invitación
        document.getElementById('invite-btn').addEventListener('click', () => {
            const url = window.location.origin;
            navigator.clipboard.writeText(url).then(() => {
                alert("¡Enlace copiado! Envíalo a tus amigos para que se unan.");
            });
        });
    </script>
</body>
</html>
