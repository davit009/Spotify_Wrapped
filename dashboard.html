<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiDuel - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen p-6">
    <nav class="max-w-4xl mx-auto flex justify-between items-center mb-10 border-b border-neutral-800 pb-4">
        <h1 class="text-2xl font-bold">Spoti<span class="text-[#1DB954]">Duel</span></h1>
        <div class="flex items-center gap-4">
            <!-- Info de usuario -->
            <img id="user-avatar" class="w-8 h-8 rounded-full hidden" alt="Avatar">
            <span id="user-name" class="text-neutral-300 font-medium">Cargando...</span>
            <button id="logout-btn" class="text-xs bg-neutral-800 hover:bg-neutral-700 px-3 py-1 rounded-md transition-colors">Salir</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Tarjeta Stats -->
        <div class="bg-[#181818] p-6 rounded-xl border border-neutral-800 col-span-1 md:col-span-2 hover:bg-[#282828] transition-colors">
            <h2 class="text-neutral-400 mb-1">Tiempo Total de Escucha</h2>
            <div class="text-5xl font-bold mb-4"><span id="total-hours">0</span><span class="text-lg text-[#1DB954] ml-1">h</span> <span id="total-minutes">0</span><span class="text-lg text-[#1DB954] ml-1">m</span></div>
            <p class="text-xs text-neutral-500">Desde tu registro</p>
        </div>

        <div class="bg-[#181818] p-6 rounded-xl border border-neutral-800 col-span-1 flex flex-col justify-center items-center hover:bg-[#282828] transition-colors">
            <button class="bg-[#1DB954] text-black font-bold py-3 px-5 rounded-full hover:scale-105 transition-transform text-sm">Comparar con Amigos</button>
            <p class="text-xs text-neutral-500 mt-4 text-center">Estadísticas globales</p>
        </div>

        <!-- Contenedor Now Playing -->
        <div id="now-playing-card" class="bg-[#181818] p-6 rounded-xl border border-neutral-800 col-span-1 md:col-span-3 flex items-center gap-4 hidden hover:bg-[#282828] transition-colors mt-2">
            <img id="np-image" class="w-16 h-16 rounded-md shadow-md object-cover" src="" alt="Album Art">
            <div class="flex-1 overflow-hidden">
                <p class="text-xs text-[#1DB954] font-bold uppercase tracking-wider mb-1 flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#1DB954] opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-[#1DB954]"></span>
                    </span>
                    Escuchando ahora
                </p>
                <h3 id="np-title" class="text-lg font-bold text-white truncate">Canción</h3>
                <p id="np-artist" class="text-sm text-neutral-400 truncate">Artista</p>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/tracking.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let redirectTimeout;
            
            // Escuchar cambios de estado de autenticación (más seguro para redirecciones OAuth)
            supabaseClient.auth.onAuthStateChange((event, session) => {
                console.log("Auth event:", event, "Session:", session);
                
                if (session) {
                    // Si encontramos sesión, cancelamos cualquier redirección pendiente
                    if (redirectTimeout) clearTimeout(redirectTimeout);
                    
                    // Actualizar la interfaz con datos de Spotify
                    const userMeta = session.user.user_metadata;
                    document.getElementById('user-name').textContent = userMeta.full_name || 'Usuario';
                    
                    if (userMeta.avatar_url) {
                        const avatarImg = document.getElementById('user-avatar');
                        avatarImg.src = userMeta.avatar_url;
                        avatarImg.classList.remove('hidden');
                    }
                    
                    loadStats(session.user.id);
                    // Actualizar si tracking.js guarda una nueva canción
                    document.addEventListener('trackSaved', () => loadStats(session.user.id));
                } else {
                    // Si no hay sesión, programar la expulsión (por si no carga en 2 seg)
                    console.log("No hay sesión aún. Esperando 2 segundos...");
                    redirectTimeout = setTimeout(() => {
                        console.log("Redirigiendo al index...");
                        window.location.href = 'index.html';
                    }, 2000);
                }
            });

            // Llamada inicial por si el evento no se dispara
            const { data, error } = await supabaseClient.auth.getSession();
            if (error) console.error("Error en getSession:", error);
            console.log("Initial getSession:", data.session);

            // Lógica de Logout
            document.getElementById('logout-btn').addEventListener('click', async () => {
                await supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            });
        });

        async function loadStats(userId) {
            const { data: sessions, error } = await window.supabaseClient
                .from('listening_sessions')
                .select('duration_ms')
                .eq('user_id', userId);
                
            if (error) {
                console.error("Error cargando estadísticas:", error);
                return;
            }
            
            // Sumar duraciones
            const totalMs = sessions.reduce((acc, curr) => acc + curr.duration_ms, 0);
            const totalMinutes = Math.floor(totalMs / 60000);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            
            // Actualizar interfaz
            document.getElementById('total-hours').textContent = hours;
            document.getElementById('total-minutes').textContent = minutes;
        }
    </script>
</body>
</html>
