<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiStats - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#121212] text-white min-h-screen p-6">
    <nav class="max-w-4xl mx-auto flex justify-between items-center mb-10 border-b border-neutral-800 pb-4">
        <h1 class="text-2xl font-bold">Spoti<span class="text-[#1DB954]">Stats</span></h1>
        <div class="flex items-center gap-3">
            <a href="profile.html" class="text-xs font-bold text-black bg-[#1DB954] hover:bg-[#1ed760] transition-colors px-3 py-1.5 rounded-full mr-2">Historia Musical</a>
            <!-- Info de usuario -->
            <img id="user-avatar" class="w-8 h-8 rounded-full hidden" alt="Avatar">
            <span id="user-name" class="text-neutral-300 font-medium hidden sm:inline">Cargando...</span>
            <button id="logout-btn" class="text-xs bg-neutral-800 hover:bg-neutral-700 px-3 py-1.5 rounded-md transition-colors">Salir</button>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Columna Izquierda (En Vivo y Últimas Escuchadas) -->
        <div class="lg:col-span-2 flex flex-col gap-6">
            <!-- Contenedor Now Playing (Hero) -->
            <div id="now-playing-card" class="relative overflow-hidden bg-gradient-to-br from-[#1DB954]/20 to-[#121212] p-6 sm:p-8 rounded-2xl border border-[#1DB954]/30 flex flex-col sm:flex-row items-center sm:items-start gap-4 sm:gap-6 hidden shadow-2xl shadow-[#1DB954]/10 transition-all text-center sm:text-left">
                <img id="np-image" class="w-20 h-20 sm:w-24 sm:h-24 rounded-lg shadow-2xl object-cover z-10" src="" alt="Album Art">
                <div class="flex-1 overflow-hidden z-10 w-full">
                    <p class="text-xs text-[#1DB954] font-bold uppercase tracking-wider mb-2 flex items-center justify-center sm:justify-start gap-2">
                        <span class="relative flex h-2.5 w-2.5">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#1DB954] opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#1DB954]"></span>
                        </span>
                        Escuchando ahora
                    </p>
                    <h3 id="np-title" class="text-2xl sm:text-3xl font-black text-white truncate mb-1">Canción</h3>
                    <p id="np-artist" class="text-base sm:text-lg text-neutral-300 truncate">Artista</p>
                </div>
                <!-- Decoración de fondo -->
                <div class="absolute -right-10 -bottom-10 opacity-10 pointer-events-none">
                    <svg width="200" height="200" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15.001 10.62 18.661 12.9c.42.18.6.78.3 1.14zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.62.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z" /></svg>
                </div>
            </div>

            <!-- Últimas 5 Escuchadas -->
            <div class="bg-[#181818] p-6 rounded-2xl border border-neutral-800 shadow-xl">
                <h3 class="text-xl font-bold mb-4 flex items-center gap-2 text-white">
                    <svg class="w-5 h-5 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Historial Reciente
                </h3>
                <div id="recent-tracks-list" class="flex flex-col">
                    <div class="animate-pulse flex space-x-4 p-3">
                        <div class="rounded-md bg-neutral-800 h-10 w-10"></div>
                        <div class="flex-1 space-y-2 py-1">
                            <div class="h-2 bg-neutral-800 rounded w-3/4"></div>
                            <div class="h-2 bg-neutral-800 rounded w-1/2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Columna Derecha (Resumen Histórico) -->
        <div class="flex flex-col gap-6">
            <!-- Tarjeta Stats Total -->
            <div class="bg-gradient-to-b from-[#181818] to-[#121212] p-6 rounded-2xl border border-neutral-800 text-center shadow-xl">
                <h2 class="text-neutral-400 mb-2 font-medium">Tiempo de Escucha</h2>
                <div class="text-5xl font-black mb-1 text-white"><span id="total-hours">0</span><span class="text-lg text-[#1DB954] ml-1">h</span> <span id="total-minutes">0</span><span class="text-lg text-[#1DB954] ml-1">m</span></div>
                <p class="text-xs text-[#1DB954] bg-[#1DB954]/10 inline-block px-3 py-1 rounded-full mt-2">Registrado en la nube</p>
            </div>

            <!-- Top Día -->
            <div class="bg-[#181818] p-6 rounded-2xl border border-neutral-800 shadow-xl">
                <h3 class="text-sm font-bold text-neutral-400 uppercase tracking-wider mb-2 flex items-center gap-2">🔥 Tu obsesión de hoy</h3>
                <div id="card-top-today" class="min-h-[72px]">
                    <p class="text-xs text-neutral-600 italic mt-4">Buscando datos...</p>
                </div>
            </div>

            <!-- Top Semana -->
            <div class="bg-[#181818] p-6 rounded-2xl border border-neutral-800 shadow-xl">
                <h3 class="text-sm font-bold text-neutral-400 uppercase tracking-wider mb-2 flex items-center gap-2">🏆 Rey de la semana</h3>
                <div id="card-top-week" class="min-h-[72px]">
                    <p class="text-xs text-neutral-600 italic mt-4">Buscando datos...</p>
                </div>
            </div>

            <!-- Botón Amigos (Preparación para Fase 4) -->
            <button class="bg-white text-black font-bold py-4 px-6 rounded-2xl hover:scale-[1.02] transition-transform w-full shadow-lg shadow-white/5 flex items-center justify-center gap-2 mt-auto">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                Retar a un Amigo
            </button>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/tracking.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let redirectTimeout;
            
            // Escuchar cambios de estado de autenticación (más seguro para redirecciones OAuth)
            supabaseClient.auth.onAuthStateChange((event, session) => {
                console.log("Auth event:", event, "Session:", session);
                
                if (session) {
                    // Si encontramos sesión, cancelamos cualquier redirección pendiente
                    if (redirectTimeout) clearTimeout(redirectTimeout);
                    
                    // IMPORTANTE: Asegurar que el usuario exista físicamente en public.users 
                    // Y guardar su token de refresco para el tracking automático (Fase 3)
                    if (session.provider_refresh_token) {
                        supabaseClient.from('users').upsert(
                            { 
                                id: session.user.id,
                                spotify_refresh_token: session.provider_refresh_token
                            }, 
                            { onConflict: 'id' }
                        ).then(() => console.log("Usuario y Refresh Token asegurados en BD."));
                    }

                    // Actualizar la interfaz con datos de Spotify
                    const userMeta = session.user.user_metadata;
                    document.getElementById('user-name').textContent = userMeta.full_name || 'Usuario';
                    
                    if (userMeta.avatar_url) {
                        const avatarImg = document.getElementById('user-avatar');
                        avatarImg.src = userMeta.avatar_url;
                        avatarImg.classList.remove('hidden');
                    }
                    
                    loadStats(session.user.id);
                    loadDynamicStats(session); // <--- Nueva función que carga los Tops
                    // Actualizar si tracking.js guarda una nueva canción
                    document.addEventListener('trackSaved', () => loadStats(session.user.id));
                } else {
                    // Si no hay sesión, programar la expulsión (por si no carga en 2 seg)
                    console.log("No hay sesión aún. Esperando 2 segundos...");
                    redirectTimeout = setTimeout(() => {
                        console.log("Redirigiendo al index...");
                        window.location.href = 'index.html';
                    }, 2000);
                }
            });

            // Llamada inicial por si el evento no se dispara
            const { data, error } = await supabaseClient.auth.getSession();
            if (error) console.error("Error en getSession:", error);
            console.log("Initial getSession:", data.session);

            // Lógica de Logout
            document.getElementById('logout-btn').addEventListener('click', async () => {
                await supabaseClient.auth.signOut();
                window.location.href = 'index.html';
            });
        });

        async function loadStats(userId) {
            const { data: sessions, error } = await supabaseClient
                .from('listening_sessions')
                .select('duration_ms')
                .eq('user_id', userId);
                
            if (error) {
                console.error("Error cargando estadísticas:", error);
                return;
            }
            
            // Sumar duraciones
            const totalMs = sessions.reduce((acc, curr) => acc + curr.duration_ms, 0);
            const totalMinutes = Math.floor(totalMs / 60000);
            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            
            // Actualizar interfaz
            document.getElementById('total-hours').textContent = hours;
            document.getElementById('total-minutes').textContent = minutes;
        }
    </script>
    <script src="js/dashboard_stats.js"></script>
</body>
</html>
