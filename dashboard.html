<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpotiStats | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        #album-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; filter: blur(80px) saturate(1.5); opacity: 0; transition: opacity 2s ease; background-size: cover; background-position: center; }
        #album-bg.visible { opacity: 0.3; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8">
    <div id="album-bg"></div>

    <header class="max-w-7xl mx-auto flex justify-between items-center mb-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-[#1DB954] rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(29,185,84,0.4)]">
                <svg class="w-6 h-6 text-black" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.5 14.75c-.15.25-.45.35-.7.2-2.35-1.45-5.3-1.75-8.8-.95-.3.05-.6-.15-.65-.45s.15-.6.45-.65c3.85-.85 7.1-.5 9.7 1.1.25.15.35.45.2.75zm1.25-2.75c-.2.3-.6.4-.9.2-2.7-1.65-6.8-2.15-9.95-1.15-.35.1-.7-.1-.8-.45s.1-.7.45-.8c3.65-1.1 8.15-.55 11.25 1.35.3.15.4.55.2.85zm.1-2.8c-3.25-1.95-8.65-2.15-11.75-1.2-.5.15-1-.15-1.15-.65-.15-.5.15-1 .65-1.15 3.55-1.1 9.5-.85 13.25 1.4.45.25.6.85.35 1.3-.25.45-.85.6-1.35.3z"/></svg>
            </div>
            <h1 class="text-2xl font-black tracking-tighter">SpotiStats</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="profile.html" class="text-xs font-bold uppercase tracking-widest text-neutral-400 hover:text-white transition-colors">Historial Completo</a>
            <button id="settings-btn" class="p-2 text-neutral-400 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
            <div class="flex items-center gap-3 bg-white/5 p-1 pr-4 rounded-full border border-white/10">
                <img id="user-avatar" src="" class="w-8 h-8 rounded-full border border-white/10 hidden" alt="Avatar">
                <span id="user-name" class="text-sm font-bold">Cargando...</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-[1.5fr_1fr] gap-8">
        <div class="flex flex-col gap-6">
            <div id="now-playing-card" class="relative group overflow-hidden rounded-[2.5rem] glass p-1 transition-all duration-700 hidden shadow-2xl">
                <div class="flex flex-col sm:flex-row gap-6 p-6 relative z-10">
                    <div class="relative shrink-0 w-full sm:w-48 aspect-square rounded-3xl overflow-hidden shadow-2xl">
                        <img id="np-image" src="" class="w-full h-full object-cover" alt="Album Art">
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <div class="flex items-center justify-center sm:justify-start gap-2 mb-2">
                            <span class="flex h-1.5 w-1.5 rounded-full bg-[#1DB954] animate-pulse"></span>
                            <span class="text-[10px] font-black uppercase tracking-[0.3em] text-[#1DB954]">En Vivo</span>
                        </div>
                        <h3 id="np-title" class="text-xl sm:text-3xl font-black text-white truncate mb-1">Cargando...</h3>
                        <p id="np-artist" class="text-base sm:text-lg text-neutral-400 truncate mb-6">Artista</p>
                    </div>
                </div>
                <div class="px-8 pb-8">
                    <div class="flex justify-between text-[10px] text-neutral-500 mb-2 font-mono">
                        <span id="np-current-time">0:00</span>
                        <span id="np-duration">0:00</span>
                    </div>
                    <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
                        <div id="np-progress-bar" class="bg-[#1DB954] h-full w-0 transition-all duration-1000 ease-linear shadow-[0_0_15px_rgba(29,185,84,0.5)]"></div>
                    </div>
                </div>
            </div>

            <div id="recent-history-card" class="glass p-8 rounded-[2.5rem] cursor-pointer hover:border-neutral-700 transition-all group">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-black flex items-center gap-3">
                        <svg class="w-6 h-6 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Últimas escuchadas
                    </h3>
                </div>
                <div id="recent-tracks-list" class="space-y-4"></div>
            </div>
        </div>

        <div class="flex flex-col gap-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div id="card-top-today" class="glass p-6 rounded-3xl min-h-[160px] flex flex-col justify-center relative overflow-hidden group cursor-pointer">
                    <h3 class="text-[10px] font-black uppercase text-neutral-500 mb-4 tracking-widest">Más escuchada (Hoy)</h3>
                </div>
                <div id="card-top-week" class="glass p-6 rounded-3xl min-h-[160px] flex flex-col justify-center relative overflow-hidden group cursor-pointer">
                    <h3 class="text-[10px] font-black uppercase text-neutral-500 mb-4 tracking-widest">Más escuchada (Semana)</h3>
                </div>
                <div class="glass p-6 rounded-3xl flex flex-col items-center justify-center text-center">
                    <h3 class="text-[10px] font-black uppercase text-neutral-500 mb-1 tracking-widest">Total Escuchado</h3>
                    <p id="stats-total-hours" class="text-4xl font-black italic">0<span class="text-lg font-normal text-neutral-600 ml-1">h</span></p>
                </div>
                <div id="card-social-today" class="glass p-6 rounded-3xl min-h-[140px] flex flex-col justify-center relative group hover:scale-[1.02] transition-transform cursor-pointer">
                    <h3 class="text-[10px] font-black uppercase text-neutral-500 mb-4 tracking-widest">Líder del Día (Dúo)</h3>
                    <div id="social-today-content" class="flex items-center gap-3"></div>
                </div>
            </div>
            <button id="open-social-btn" class="bg-white text-black font-black py-5 px-6 rounded-[2rem] hover:scale-[1.02] transition-all w-full shadow-2xl flex items-center justify-center gap-3 uppercase text-xs tracking-widest">
                Gestionar Desafíos
            </button>
        </div>
    </main>

    <!-- Modales (Simplified for the sake of the script fix) -->
    <div id="social-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#121212] p-8 rounded-[3rem] border border-white/5 w-full max-w-xl shadow-2xl flex flex-col max-h-[90vh]" id="social-modal-content">
            <div class="flex justify-between items-start mb-8 shrink-0">
                <h2 class="text-4xl font-black text-white italic">Dúos</h2>
                <button id="close-social-modal" class="bg-white/5 hover:bg-white/10 p-3 rounded-full transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="flex gap-6 mb-8 border-b border-white/5 pb-2 shrink-0">
                <button class="social-tab active text-[#1DB954] border-b-2 border-[#1DB954] pb-4 font-black uppercase text-xs tracking-widest" data-tab="active">Mis Retos</button>
                <button class="social-tab text-neutral-500 hover:text-white pb-4 font-black uppercase text-xs tracking-widest transition-colors" data-tab="search">Buscar Amigos</button>
            </div>
            <div id="social-tab-active" class="flex-1 overflow-y-auto custom-scrollbar space-y-4 pr-2"></div>
            <div id="social-tab-search" class="hidden flex-1 flex flex-col overflow-hidden">
                <input type="text" id="user-search-input" placeholder="Nombre..." class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 px-6 text-white mb-4">
                <div id="user-search-results" class="flex-1 overflow-y-auto custom-scrollbar space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- Modales de Stats (Hidden for now to focus on the fix) -->
    <div id="list-modal" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#121212] p-8 rounded-[3rem] border border-white/5 w-full max-w-lg shadow-2xl flex flex-col max-h-[85vh]" id="list-modal-content">
            <div class="flex justify-between items-start mb-8 shrink-0">
                <h2 id="list-modal-title" class="text-2xl font-black italic text-white text-[#1DB954]">Título</h2>
                <button id="close-list-modal" class="bg-white/5 hover:bg-white/10 p-3 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="list-modal-body" class="overflow-y-auto pr-2 space-y-3 flex-1 custom-scrollbar"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { supabaseClient } from './js/supabase.js';
        import { TokenManager } from './js/token_manager.js';
        import { initDashboard } from './js/dashboard_stats.js';
        import { checkCurrentlyPlaying, syncOfflineHistory } from './js/tracking.js';
        import { initSocial } from './js/social.js';

        let initialized = false;

        async function startDashboard(session) {
            if (initialized) return;
            initialized = true;
            
            if (session) {
                const userMeta = session.user.user_metadata;
                document.getElementById('user-name').textContent = userMeta.full_name || 'Usuario';
                if (userMeta.avatar_url) {
                    const avatarImg = document.getElementById('user-avatar');
                    avatarImg.src = userMeta.avatar_url;
                    avatarImg.classList.remove('hidden');
                }

                // Cargar Stats e Iniciar Polling
                await initDashboard(session);
                initSocial(session.user);
                
                // Sincronización inicial y polling
                syncOfflineHistory(session);
                setInterval(() => checkCurrentlyPlaying(session), 10000);
            }
        }

        // Auth Flow
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session) startDashboard(session);
            else window.location.href = 'index.html';
        });

        // Config de Modales Básica
        document.getElementById('open-social-btn')?.addEventListener('click', () => document.getElementById('social-modal').classList.remove('hidden'));
        document.getElementById('close-social-modal')?.addEventListener('click', () => document.getElementById('social-modal').classList.add('hidden'));
        document.getElementById('close-list-modal')?.addEventListener('click', () => document.getElementById('list-modal').classList.add('hidden'));
    </script>
</body>
</html>
